      location: this cell's scripts, because src/karc/bench/e5_cross_runtime.py is
        line-frozen and carries only ClaudeRates
  control:
    A: {input: 2.00, output: 10.00, read: 0.20, write_5m: 2.50, write_1h: 4.00}
    B: {input: 0.20, output: 1.20, read: 0.02, write: 0.25}
    note: pi's own catalog, used only to reverse-verify that pi's reported
      usage.cost is reproducible from the four recorded buckets.  The Anthropic
      entry is the introductory card expiring 2026-08-31; its ratios equal the
      standard card's, so no judgement moves (E17 section 8).

statistics:
  unit: session
  method: paired percentile bootstrap, common random numbers
  seed: 1313
  resamples: 10000
  ci: two-sided 95 percent percentile
  percentile_convention: lo = sorted[floor(0.025*B)], hi = sorted[ceil(0.975*B)-1]
  ratio_comparisons_are_against: 1.0
  difference_comparisons_are_against: 0
  reversal_threshold: >
    mu_w* solves dU + mu_w*dW + mu_r*dR + mu_o*dO = 0 with d = karc - rag, and is
    recomputed from each leg's OWN component totals with that leg's own mu_r and
    mu_o.  E13's 1.7217 / appendix C.2's 1.7486 are prediction inputs, not results,
    and are never carried across.

predictions_and_judgement_rules:
  P1: leg gross ratio karc/rag - 95 percent CI entirely above 1.0
  P2: leg A priced ratio - 95 percent CI entirely below 1.0 AND paired mean USD
    difference CI excludes 0
  P3: leg A component signature - delta_read > 0 AND delta_creation < 0
  P4: leg B priced ratio - 95 percent CI entirely above 1.0 (a prediction against
    our own headline)
  P5: leg B component signature - delta_read > 0 AND delta_creation < 0
  section_5_rule: if P1 fails, P2 is NOT judged and the cell turns to root-cause
  section_5_duty: if P2 fails, that is the result and is reported as such

hold_conditions:
  H1: any unit whose three round-trip paths disagree
  H2': a turn with output_tokens == 0, or an errorMessage, or no content block
  H3: any per-call closure violation
  H4: leg A only - any call with cacheWrite1h == 0
  H4'': the first cache-eligible cold call (cacheRead == 0 and prefix >= 1024)
    reporting cacheWrite == 0
  H5: session completion failure rate above 10 percent
  H6: model spend above 15 USD across both legs
  H7: any mtime change on the user's ~/.pi paths
  H8': a cache-eligible call (prefix >= 1024) with cacheRead == 0 AND
    cacheWrite == 0.  Sub-threshold session-opening calls reporting 0/0 are
    expected and are recorded, not held on (appendix B.1).
  H9: released by appendix C.1
  escalation: H2', H3 and H4/H4'' are full-redesign causes, not partial-discard
    causes

privacy_R9: raw/ carries counts, public identifiers, sha256 and usage numbers
  only.  Prompts, model text and tool results are never written there.  The pi
  event streams and session stores under tmp/e18/{sessions,streams} hold
  transcripts and are gitignored; they are left in place for parent-session audit
  and must be deleted at teardown (rm -rf tmp/e18).

not_claimed:
  - accuracy or quality (preregistration section 7; the axis is degenerate in the
    baseline and the incidental grade recorded here is diagnostic only)
  - absolute token or dollar comparison between harnesses (E17 section 10)
  - absolute token or dollar comparison between providers (appendix A.5)
  - which provider is cheaper
  - closeness of the two legs' mu_w* (appendix A.3)
  - the real lifetime of a 1-hour or 30-minute cache entry
