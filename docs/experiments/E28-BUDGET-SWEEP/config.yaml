# E28-BUDGET-SWEEP — confirmed configuration (R-16)
#
# Frozen before the first model call.  `cell.json` in this directory is the
# machine-readable form of the same facts and is authoritative where the two
# could ever disagree; this file is the R-16 document view.  Everything here is
# either quoted from the preregistration or measured model-free by
# `scripts/run_e28.py build`, whose outputs are committed under `raw/<tag>/`.

cell: E28-BUDGET-SWEEP
preregistration: docs/experiments/E28-BUDGET-SWEEP/preregistration.md
preregistration_status: registered before observation, 2026-09-13
parent_cells:
  - E18-PI-REVERSAL leg B (paper name pi-O-g)
  - E18-PI-REVERSAL leg A (paper name pi-A-g)
derived_from:
  runner: docs/experiments/E18-PI-REVERSAL/scripts/run_e18_pi_reversal.py
  analyzer: docs/experiments/E18-PI-REVERSAL/scripts/analyze_e18.py
  budget_override_pattern: docs/experiments/E27-BUDGET-10PCT/scripts/run_e27.py
  how: >
    run_e28.py imports E18's runner as a module and replaces only the run/raw
    roots, the execution namespace, the batch spend guard, and `build_bundle`
    (the same builder at this cell's budget).  analyze_e28.py imports E18's
    analyzer and reuses its bootstrap, crosscheck, statistics and per-position
    profile functions unchanged, adding only this batch's cross-cell tables.

question: >
  E27 raised the resident budget on E19 leg B's steady-state cell and the
  measurement window moved with it, so that contrast is budget plus window
  position.  With the window held fixed -- by moving to E18's growth window
  S01-S12, which is the whole 12-session build and has no warm-up to grow --
  what does the budget alone do, at 2.5%, 10% and 20%?

harness:
  runtime: pi 0.84.3
  binary: tmp/vendor/piprobe/node_modules/.bin/pi
  isolation_root: tmp/e28/
  never_touched: [~/.pi, ~/.codex, ~/.claude, tmp/e17, tmp/e17b, tmp/e18,
                  tmp/e19, tmp/e21, tmp/e23, tmp/e25, tmp/e26, tmp/e27]
  env:
    PI_CODING_AGENT_DIR: tmp/e28/leg<L><tag>/pi-home
    PI_CODING_AGENT_SESSION_DIR: tmp/e28/leg<L><tag>/sessions
    PI_OFFLINE: "1"
    PI_SKIP_VERSION_CHECK: "1"
    PI_TELEMETRY: "0"
    PI_CACHE_RETENTION: long on leg A; unset on leg B (E17B appendix B.3)
    note: >
      the child environment is constructed from scratch (HOME, PATH, LANG plus
      the PI_* isolation variables), so no variable of the calling session --
      FORCE_COLOR included -- reaches pi.
  settings:
    defaultProjectTrust: never
    compaction.enabled: false
  flags_per_turn:
    - --mode json
    - --provider <leg> --model <model> --thinking off
    - --no-extensions --no-context-files --no-skills --no-prompt-templates
    - --no-themes --no-approve
    - --append-system-prompt <unit>/context/system-append.md
    - karc-full adds: -e <bridge> --no-builtin-tools --tools karc_search,karc_get
    - rag-bm25 adds: --no-tools

cells:
  E28-O-025: {leg: B, provider: openai,    model: gpt-5.6-luna,     budget_pct: 2.5, budget_tokens: 878,  control: pi-O-g, order: 2}
  E28-O-10:  {leg: B, provider: openai,    model: gpt-5.6-luna,     budget_pct: 10,  budget_tokens: 3512, control: pi-O-g, order: 1}
  E28-O-20:  {leg: B, provider: openai,    model: gpt-5.6-luna,     budget_pct: 20,  budget_tokens: 7025, control: pi-O-g, order: 3}
  E28-A-10:  {leg: A, provider: anthropic, model: claude-sonnet-5,  budget_pct: 10,  budget_tokens: 3512, control: pi-A-g, order: 4}

provider_keys:
  leg_B: >
    ~/api-key.txt OPENAI_API_KEY, read by run_e28.py itself, never printed,
    never in argv, never exported into the calling session; placed only into the
    constructed pi child environment as OPENAI_API_KEY.
  leg_A: >
    ~/api-key.txt CLAUDE_API_KEY, same handling; placed into the pi child
    environment as ANTHROPIC_API_KEY.

arms: [karc-full, rag-bm25]

manipulated_axis:
  name: resident budget
  operative_knob: e5_killgate._manifest_at_budget(manifest, budget_pct)
  grid_available_e4_fixture: [1, 2, 5, 10, 20]
  grid_available_e5_killgate: [5, 10]
  values_measured: [2.5, 10, 20]
  control_point_not_re_run_here: {budget_pct: 5, budget_tokens: 1756}
  budget_pct_20_arithmetic: >
    int(35128 * 20 / 100) = int(7025.6) = 7025.  The requesting brief wrote
    7,024; the machine value 7,025 is registered.  The knob position (pct = 20)
    is unchanged and no number was hand-picked.
  what_it_moves:
    karc_full: >
      the model-free policy replay runs with c = budget_tokens, so the resident
      set admitted per session grows.  Last session (S12) of the build:
      10 versions / 858 tokens at 2.5%, 20 / 1,735 at 5%, 40 / 3,432 at 10%,
      49 / 4,227 at 20%.
    rag_bm25: >
      e3_retrieval.bm25_plans is budget-parity by construction, so the retrieval
      plan pasted into each turn grows with the same number: plan tokens mean
      826.927 / 1,728.927 / 3,450.927 / 6,976.927.
    note: both arms move together; this is not a one-sided enlargement.

held_fixed:
  measurement_window: S01-S12 (the whole build; no warm-up)
  reuse_factor: 0.50
  schedule_seed: 4200
  session_count_built: 12
  session_length: 8
  paired_design: 12 sessions x 8 turns x 2 arms = 192 turns per cell
  submission_order: ABBA (E13 §5.0)
  fixture: fixture/e4-v2 (frozen, seed 4000, 408 artifacts, 35,128 corpus tokens)

not_held_fixed: []      # this is the point of the batch

window_fixity: >
  E18 measures the growth window S01-S12 of a 12-session build with no warm-up,
  so the window is the whole schedule and no budget value can move it.  E27
  inherited E19's steady-state criterion and therefore could not hold the window
  fixed; that is the confound this batch removes, and the reason it runs on
  E18's bundle (seed 4200) rather than E19/E23's (seed 4352).

