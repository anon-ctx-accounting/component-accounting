    manifest_sha256: e3dce84106730f4cafe1932cb45a574f2048b054273bb0d8a4211a09209078e4
  axis_purity_H14:
    schedule_and_tasks_equal_across_budgets: true
    manifest_and_snapshot_differ: true
    structure_statistics_equal: true
    meaning: >
      the budget does not touch the task sequence.  The only things that move
      are the resident sets and the budget-parity retrieval plans.

fractional_budget_pct:
  what: >
    e4_replay.replay_cell guards its explicit-manifest branch with
    int(cell["budget_pct"]) != budget_pct, an int() cast that assumes an integer
    percentage.  At 2.5% the manifest honestly carries budget_pct 2.5 and
    budget_tokens 878, and the guard is called with int(2.5) == 2.  budget_pct is
    used for nothing else; PolicyConfig.c comes from budget_tokens.
  falsifier: >
    phase_build also builds the genuine c = 2% bundle (702 tokens, snapshot
    ccabdc72...) and requires the 2.5% resident ramp to DIFFER from it.  Measured:
    878 gives 10 versions / 858 tokens, 702 gives 8 versions / 694 tokens.

resident_utilization_trajectory:      # model-free, an INPUT state quantity
  note: >
    this is a growth window, so the resident set is not expected to fill.  The
    trajectory itself is one of the batch's observations.
  c025: [0.000, 0.395, 0.790, 0.977, 0.977, 0.977, 0.977, 0.977, 0.999, 0.999, 0.999, 0.977]
  c05:  [0.000, 0.198, 0.395, 0.593, 0.790, 0.988, 0.988, 0.977, 0.988, 0.999, 0.988, 0.988]
  c10:  [0.000, 0.099, 0.198, 0.296, 0.395, 0.494, 0.593, 0.715, 0.837, 0.959, 0.983, 0.977]
  c20:  [0.000, 0.049, 0.099, 0.148, 0.198, 0.247, 0.296, 0.357, 0.419, 0.480, 0.541, 0.602]

gold_containment:
  H12_gate: gold_containment_rate == 1.0, re-measured at every budget
  gold_containment_rate: 1.0
  mean_budget_utilization: {c025: 0.94183, c05: 0.98458, c10: 0.98261, c20: 0.99316}
  plan_tokens_mean: {c025: 826.927, c05: 1728.927, c10: 3450.927, c20: 6976.927}

accounting:
  gross: input + cacheRead + cacheWrite      # pi's usage.input is fresh-only
  inclusion_relation: re-measured in every cell, never assumed
  closure_assert_per_call: totalTokens == input + output + cacheRead + cacheWrite
  openai_cache_min_prefix_tokens: 1024
  stop_reason_layers: [pi normalized stopReason, provider rawStopReason]
  refusal_detection: >
    disjunction (output_tokens == 0, errorMessage present, content block absent,
    normalized stopReason == error) because the OpenAI leg's rawStopReason is
    always "completed" (E17B §5); the Anthropic leg additionally has the
    discriminating provider layer.
  mcp_round_trip_paths:
    - pi tool_execution_start events
    - bridge audit JSONL, scoped per turn (E17 §7.4)
    - DB ingest_observations where source_channel = 'mcp'

rate_cards_usd_per_million:            # judged column
  A:
    input: 3.00
    output: 15.00
    read: 0.30
    write_5m: 3.75
    write_1h: 6.00
    source: E13-RECOMP §4.1 recovered Anthropic claude-sonnet-5 card
  B:
    input: 0.20
    output: 1.20
    read: 0.02
    write_5m: 0.25
    write_1h: 0.25
    source: docs/analysis/openai-luna-rate-card.md, observed 2026-08-28
pi_catalog_rates_control_column:
  A: {input: 2.00, output: 10.00, read: 0.20, write_5m: 2.50, write_1h: 4.00}
  B: {input: 0.20, output: 1.20, read: 0.02, write_5m: 0.25, write_1h: 0.25}

statistics:
  method: session-unit paired percentile bootstrap
  seed: 1313
  resamples: 10000
  ci: two-sided 95% percentile
  common_random_numbers: one shared 10000 x 12 index matrix
  percentile_convention: floor(alpha/2*B), ceil((1-alpha/2)*B)-1   # E13
  ratio_definition: ratio of session sums
  difference_definition: mean of per-session paired differences

registered_hypotheses:                 # applied independently per cell
  B1: {quantity: paired gross-input ratio karc/rag with 95% CI, predicted_direction: false}
  B2: {quantity: paired priced cost ratio karc/rag with 95% CI read against 1.0, predicted_direction: false}
  B3:
    quantity: component allocation sign
    criterion: delta_cache_read(karc - rag) > 0 AND delta_creation(karc - rag) < 0
    predicted_direction: true
    judged_on: component totals over S01-S12
  B4: {quantity: break-even cache-write price mu_w* versus the actual rate (OpenAI 1.25, Anthropic 2.00), predicted_direction: false}
  why_only_B3_is_directional: >
    moving the budget grows both arms' payloads and moves both arms' call
    counts, and that interaction was never modelled.  E23 declined to predict the
    gross ordering for the same reason and was right to (it flipped at rho =
    0.75); E27 registered the same three as measured-not-predicted.  B3 is the
    only quantity the paper claims transports.

batch_level_questions:                 # measured, no criterion attached
  i: where the gross ratio sits relative to 1.0 at c = 2.5 / 5 / 10 / 20%, and
     whether at 20% it passes beyond parity
  ii: whether the cost ratio stays below 1.0 at c = 2.5%
  iii: the difference between E27 (steady state, S13-S24, c = 10%) and E28-O-10
       with the window held fixed -- read, not causally attributed (the two
       cells also differ in schedule seed and session count)

hold_conditions:
  H1: MCP round-trip three-path mismatch
  H2: refusal or non-answering turn, 1 or more
  H3: closure identity violation
  H4: first cache-eligible cold call with cacheWrite == 0 (leg A also: cacheWrite1h zero calls)
  H5: completion failure rate above 10%
  H6: cumulative batch model cost above $10; the wave stops itself at a cumulative $9
  H7: user ~/.pi mtime change, or any sibling cell root touched
  H8: cache-eligible call with read == write == 0
  H9: cold-start misattribution (write == 0 while read > 0)
  H10: execution namespace overlap; workdir path and pi session id both change
  H12: gold artifact containment rate not 1.0
  H13: degenerate zero-reuse branch
  H14: axis purity violated (the budget moved the task sequence, or the c = 5%
       control does not reproduce E18)
  H15: at c = 2.5% the policy replay admits no resident set at all -- that cell only
  H16: at c = 20% a unit fails against pi's token pacer or a context limit -- that cell only
  H11_not_applicable: this batch does not choose a window
  redesign_not_partial_discard: [H2, H3, H4, H9, H12, H13, H14]
  stop_that_cell_only: [H15, H16]

budget:
  batch_cap_usd: 10.0
  batch_stop_usd: 9.0
  currency: >
    standard rate cards.  pi charges at catalog rates, which are <= standard on
    both providers (the Anthropic catalog is 2/3 of the public card), so a
    standard-dollar ceiling bounds real spend from above.
  ledger: tmp/e28/spend-ledger.json (cumulative across the four cells)
  expectation: OpenAI cells under $1 together; the Anthropic cell $4-6 standard

execution_namespace:
  workdir: tmp/e28/leg<L><tag>/units/<arm>--<Sxx>/work
  pi_session_id: e18<tag>-<arm>-<Sxx>
  rationale: >
    E18's runner derives both the workdir path and the pi session id from one
    NAMESPACE string, so setting it to the cell tag moves both levers at once.
    E18 leg B attempt 2 was discarded because a re-run reused both levers and was
    served the discarded execution's provider-side cache; no earlier execution
    used any of these four suffixes.  The literal "e18" prefix is E18's own code,
    kept rather than forked.

privacy_R9: >
  raw carries counts, public ids, sha256 and usage numbers only; prompts appear
  as sha256 and character count.  Transcripts under tmp/e28/*/streams are
  audit-only and are removed at teardown.
teardown: rm -rf tmp/e28

not_pooled_with_the_eight_cells: >
  different capacity grid points, so these cells do not enter the abstract's
  range figures, §4's tables or figures, or the claims ledger.  Whether any of it
  reaches the 6-page paper is the user's decision.
