  judged:
    A:
      source: Anthropic claude-sonnet-5 card recovered exactly from committed
        E10-P2-XR raw by E13-RECOMP section 4.1 (== committed ClaudeRates shape)
      uncached_input: 3.00
      cache_creation_5m: 3.75
      cache_creation_1h: 6.00
      cache_read: 0.30
      output: 15.00
      multipliers: {mu_r: 0.10, mu_w_5m: 1.25, mu_w_1h: 2.00, mu_o: 5.00}
    B:
      source: docs/analysis/openai-luna-rate-card.md, primary source
        developers.openai.com, rates observed 2026-08-28 (appendix C.1)
      uncached_input: 0.20
      cache_write: 0.25
      cache_read: 0.02
      output: 1.20
